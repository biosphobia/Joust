[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joust"
version = "0.1.0"
description = "Headless, audio-only Johann Sebastian Joust clone for PlayStation Move controllers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]

[project.optional-dependencies]
hidapi = ["hidapi>=0.14"]
dev = ["pytest>=7"]

[project.scripts]
joust = "joust.cli:main"

[tool.setuptools.packages.find]
include = ["joust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
